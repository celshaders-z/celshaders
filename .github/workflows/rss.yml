name: Update RSS feed

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Generate feed.xml
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow; fi
          python3 - <<'PY'
          import re, html, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from email.utils import format_datetime

          SITE = "https://celshaders.com/"
          PST = ZoneInfo("America/Los_Angeles")
          page = open("index.html", encoding="utf-8").read()

          def commit_time(date):
              """Time (Pacific) of the oldest commit that added this post's date line."""
              out = subprocess.run(
                  ["git", "log", f'-S<div class="Date">{date}</div>', "--reverse",
                   "--format=%aI", "--", "index.html"],
                  capture_output=True, text=True,
              ).stdout.strip().splitlines()
              return datetime.fromisoformat(out[0]).astimezone(PST) if out else None

          posts = re.findall(r'<div class="Date">(.*?)</div>\s*<div class="Post">(.*?)</div>', page, re.S)

          items = ""
          for date, post in posts:
              date = date.strip()
              month, day, year = re.sub(r"(st|nd|rd|th)", "", date).split()
              written = datetime.strptime(f"{month[:3]} {day} {year}", "%b %d %Y")
              title, _, body = post.partition("<br>")
              title = title.strip()
              body = re.sub(r'(href|src)="(?!https?://)/?', rf'\1="{SITE}', body)

              when = commit_time(date) or datetime.now(PST)

              items += f"""<item>
          <title>{html.escape(title)}</title>
          <link>{SITE}</link>
          <guid isPermaLink="false">{written.date()}-{html.escape(title)}</guid>
          <pubDate>{format_datetime(when)}</pubDate>
          <description><![CDATA[{body.strip()}]]></description>
          </item>
          """

          open("feed.xml", "w", encoding="utf-8").write(f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
          <channel>
          <title>Fblog - celshaders.com</title>
          <link>{SITE}</link>
          <description>celshaders.com is an ugly website full of terrible garbage. Please stay away.</description>
          {items}</channel>
          </rss>
          """)
          PY

      - name: Commit feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || (git commit -m "Update RSS feed" && git pull --rebase && git push)
