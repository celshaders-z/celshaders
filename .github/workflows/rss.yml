name: Update RSS feed

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate feed.xml
        run: |
          python3 - <<'PY'
          import re, html
          from datetime import datetime, timezone
          from email.utils import format_datetime

          SITE = "https://celshaders.com/"
          page = open("index.html", encoding="utf-8").read()

          # every <div class="Date">...</div> followed by <div class="Post">...</div>
          posts = re.findall(r'<div class="Date">(.*?)</div>\s*<div class="Post">(.*?)</div>', page, re.S)

          items = ""
          for date, post in posts:
              month, day, year = re.sub(r"(st|nd|rd|th)", "", date.strip()).split()
              when = datetime.strptime(f"{month[:3]} {day} {year}", "%b %d %Y").replace(hour=12, tzinfo=timezone.utc)
              title, _, body = post.partition("<br>")
              body = re.sub(r'(href|src)="(?!https?://)/?', rf'\1="{SITE}', body)  # make links absolute
              items += f"""<item>
          <title>{html.escape(title.strip())}</title>
          <link>{SITE}</link>
          <guid isPermaLink="false">{when.date()}-{html.escape(title.strip())}</guid>
          <pubDate>{format_datetime(when)}</pubDate>
          <description><![CDATA[{body.strip()}]]></description>
          </item>
          """

          open("feed.xml", "w", encoding="utf-8").write(f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
          <channel>
          <title>Fblog - celshaders.com</title>
          <link>{SITE}</link>
          <description>celshaders.com is an ugly website full of terrible garbage. Please stay away.</description>
          {items}</channel>
          </rss>
          """)
          PY

      - name: Commit feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || (git commit -m "Update RSS feed" && git push)
